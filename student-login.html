<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login — Tannu Sir's Kids Digital Academy</title><style>
:root{--ink:#202443;--muted:#737a98;--purple:#6c5cff;--cyan:#23d2c5;--pink:#ef4da8;--line:#e8e7f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 20%,rgba(108,92,255,.28),transparent 28%),radial-gradient(circle at 90% 25%,rgba(35,210,197,.25),transparent 28%),linear-gradient(135deg,#101538,#181d4a)}button,input{font:inherit}button{cursor:pointer}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.5) 1px,transparent 1.2px);background-size:55px 55px;opacity:.18;animation:move 20s linear infinite}@keyframes move{to{background-position:55px 55px}}
.card{position:relative;width:min(470px,100%);background:#fff;border-radius:31px;padding:30px;box-shadow:0 30px 100px rgba(0,0,0,.3);overflow:hidden}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:linear-gradient(90deg,#6c5cff,#23d2c5,#ef4da8,#ffc84c,#6c5cff);background-size:300%;animation:run 3s linear infinite}@keyframes run{to{background-position:300% 0}}.brand{display:flex;align-items:center;gap:12px}.cube{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:31px;font-weight:1000;background:linear-gradient(135deg,#6c5cff,#23d2c5);box-shadow:0 10px 25px rgba(108,92,255,.28)}.brand h1{margin:0;font-size:24px}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}.ribbon{display:inline-block;margin:19px 0 7px;padding:7px 11px;border-radius:99px;color:#fff;background:linear-gradient(90deg,#6c5cff,#ef4da8,#ff9b4a);font-size:9px;letter-spacing:1.2px;font-weight:1000}.welcome{font-size:30px;margin:9px 0 5px}.sub{color:var(--muted);font-size:12px;line-height:1.6}.field{margin-top:14px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input{width:100%;border:1px solid #dfe1ef;border-radius:14px;padding:13px;outline:none}.field input:focus{border-color:#8c82ff;box-shadow:0 0 0 4px rgba(108,92,255,.09)}.login{width:100%;border:0;border-radius:15px;padding:14px;margin-top:18px;background:linear-gradient(135deg,#6c5cff,#895ff4);color:#fff;font-weight:1000;box-shadow:0 13px 28px rgba(108,92,255,.25)}.help{margin-top:14px;padding:12px;border-radius:14px;background:#f7f7fd;color:var(--muted);font-size:10px;line-height:1.55}.home-top{display:flex;align-items:center;justify-content:center;width:100%;margin-bottom:17px;padding:12px 14px;border-radius:14px;background:#f0efff;color:#574bc9;text-decoration:none;font-size:11px;font-weight:1000;border:1px solid #e0def8}.home-top:hover{background:#e6e3ff}.links{display:flex;justify-content:space-between;gap:10px;margin-top:17px}.links a{font-size:10px;font-weight:900;color:#5b4ed0;text-decoration:none}.msg{display:none;margin-top:13px;padding:11px;border-radius:12px;font-size:10px;font-weight:800}.msg.show{display:block}.msg.bad{background:#ffe9ed;color:#c34258}.msg.good{background:#e7fbf3;color:#16815f}
.cube{background:none!important;box-shadow:none!important;width:58px!important;height:58px!important}.cube .t-logo{width:58px;height:58px}.homebtn{display:block;text-align:center;margin-top:11px;padding:13px;border-radius:14px;background:#eef5ff;color:#5148b9;text-decoration:none;font-weight:900;font-size:11px}</style></head><body><div class="stars"></div><form id="form" class="card"><div class="brand"><div class="cube"><span class="t-logo" aria-label="Tannu Sir logo"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46e4df"/><stop offset=".48" stop-color="#7765ff"/><stop offset="1" stop-color="#ff67b8"/></linearGradient></defs><circle cx="32" cy="32" r="29" fill="url(#tg)"/><circle cx="32" cy="32" r="23" fill="#12194b" opacity=".94"/><path d="M17 18h30v8H36v23h-8V26H17z" fill="#fff"/><path d="M13 35c8 10 30 15 40-1" fill="none" stroke="#55e1d7" stroke-width="2.5" stroke-linecap="round" opacity=".9"/><circle cx="52" cy="33" r="3.3" fill="#ffd65c"/></svg></span></div><div><h1>Student Login</h1><p>Tannu Sir's Kids Digital Academy</p></div></div><span class="ribbon">🎓 PRIVATE STUDENT ACCESS</span><h2 class="welcome">Welcome, Explorer! 🚀</h2><p class="sub">Use the private Student ID and password provided for your account.</p><div class="field"><label>Student ID</label><input id="username" autocomplete="username" placeholder="Enter Student ID" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Use your password" required></div><button class="login" type="submit">Enter My Academy →</button><a class="homebtn" href="index.html">🏠 Return to Academy Home</a><div id="msg" class="msg"></div><div class="help">🛡️ Never share your password with friends or strangers. Ask a parent/guardian or Tannu Sir for help.</div></form><script>const API="https://brightbyte-kids-api.tanweerstudy25.workers.dev",$=id=>document.getElementById(id);function message(t,g=false){const m=$("msg");m.textContent=t;m.className="msg show "+(g?"good":"bad")}async function existing(){const token=localStorage.getItem("brightbyte_student_token");if(!token)return;try{const r=await fetch(API+"/api/auth/me",{headers:{Authorization:`Bearer ${token}`},cache:"no-store"});const d=await r.json();if(r.ok&&d.role==="student")location.href="student-profile.html";else localStorage.removeItem("brightbyte_student_token")}catch{}}$("form").onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent="Checking...";try{const r=await fetch(API+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("username").value.trim(),password:$("password").value})});const d=await r.json();if(!r.ok||d.role!=="student")throw new Error(d.error||"Login failed");localStorage.setItem("brightbyte_student_token",d.token);message("Login successful!",true);setTimeout(()=>location.href="student-profile.html",350)}catch(err){message(err.message)}finally{b.disabled=false;b.textContent="Enter My Academy →"}};existing();</script></body></html>
