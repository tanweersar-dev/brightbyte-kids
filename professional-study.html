<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e7eef3">
<title>Professional Study Center — Tannu Sir's Kids Digital Academy</title>
<link rel="stylesheet" href="professional-study.css?v=46.0">
</head>
<body>
<div class="study-bg"></div>
<header class="study-topbar">
  <a class="study-brand" href="professional-universe.html">
    <span class="study-logo">T</span>
    <span><b>Professional Study Center</b><small>STUDY → QUIZ → PRACTICAL</small></span>
  </a>
  <div class="study-top-actions">
    <span id="studentChip" class="student-chip">👤 Student</span>
    <a href="professional-universe.html">Dashboard</a>
    <a href="professional-lab.html">Virtual Lab</a>
    <a href="student-exams.html">Exams</a>
  </div>
</header>

<div class="study-shell">
  <aside class="study-sidebar">
    <button id="allTracksBtn" class="back-tracks" type="button">← All Study Tracks</button>
    <section class="track-mini-card">
      <span id="trackIcon" class="track-icon">📘</span>
      <h2 id="trackTitle">Professional Study</h2>
      <p id="trackSubtitle">Choose a subject.</p>
      <div class="mini-progress"><i id="sideProgress"></i></div>
      <small id="sideProgressText">0% complete</small>
    </section>
    <nav id="chapterNav" class="chapter-nav" aria-label="Study chapters"></nav>
  </aside>

  <main class="study-main">
    <section id="trackPicker" class="track-picker"></section>
    <section id="lessonView" class="lesson-view" hidden>
      <div id="lessonHero"></div>
      <div class="lesson-layout">
        <div id="lessonContent" class="lesson-content"></div>
        <aside id="lessonSide" class="lesson-side"></aside>
      </div>
    </section>
    <section id="quizView" class="quiz-view" hidden></section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="professional-study.js?v=46.0"></script>
</body>
</html>
