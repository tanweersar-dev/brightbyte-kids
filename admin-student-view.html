<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111746">
<title>Student Progress — Tannu Sir's Kids Digital Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-rounded,"Segoe UI",system-ui,sans-serif;color:#f8f9ff;background:radial-gradient(circle at 10% 10%,#735cff44,transparent 28%),radial-gradient(circle at 90% 20%,#25d7cd33,transparent 25%),linear-gradient(155deg,#111747,#0b1236 60%,#092a4b)}button,a{font:inherit}.wrap{width:min(1240px,calc(100% - 24px));margin:auto;padding:18px 0 50px}.top{position:sticky;top:8px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:1px solid #ffffff1e;border-radius:22px;background:#141c50ee;backdrop-filter:blur(16px);box-shadow:0 18px 50px #0004}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-size:26px;font-weight:950;background:linear-gradient(135deg,#43ddd5,#6e5eff,#ff63b6)}.brand b,.brand small{display:block}.brand small{font-size:9px;color:#ffd56f;letter-spacing:1px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:900;text-decoration:none;cursor:pointer}.primary{color:#fff;background:linear-gradient(135deg,#6f5cff,#34d6ce)}.soft{color:#433ca3;background:#f4f3ff}.hero{margin-top:18px;padding:22px;border-radius:28px;border:1px solid #ffffff1f;background:linear-gradient(180deg,#19235ccc,#101944dd);box-shadow:0 20px 60px #0003}.profile{display:grid;grid-template-columns:140px 1fr auto;gap:22px;align-items:center}.photo{width:140px;height:140px;border-radius:30px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#665cff,#41ddd4);font-size:70px}.photo img{width:100%;height:100%;object-fit:cover}.eyebrow{display:inline-flex;padding:7px 10px;border-radius:999px;background:#ffffff14;color:#d7dcff;font-size:9px;font-weight:950;letter-spacing:1px}.hero h1{font-size:clamp(34px,5vw,58px);margin:8px 0 5px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#c3caee;font-size:12px}.privacy{padding:10px 12px;border-radius:13px;background:#ffffff10;text-align:center}.privacy b,.privacy small{display:block}.privacy small{color:#bdc6e9;margin-top:4px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:16px}.stat{padding:15px;border-radius:19px;background:#ffffff0b;border:1px solid #ffffff12}.stat b,.stat small{display:block}.stat b{font-size:25px}.stat small{margin-top:4px;color:#bcc5e8;font-size:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{padding:20px;border-radius:23px;border:1px solid #ffffff17;background:#151e51dc;box-shadow:0 14px 40px #0002}.card h2{margin:0 0 12px;font-size:20px}.muted{color:#bdc6e8;line-height:1.55}.skills{display:grid;gap:9px}.skill{display:grid;grid-template-columns:130px 1fr 48px;gap:9px;align-items:center}.bar{height:10px;border-radius:99px;background:#ffffff12;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#725cff,#38d7cf)}.list{display:grid;gap:8px}.item{padding:12px;border-radius:15px;background:#ffffff09}.item b,.item small{display:block}.item small{color:#bfc7e9;margin-top:4px}.empty{color:#99a5d4;font-style:italic}.wide{grid-column:1/-1}.habit-grid{display:flex;gap:8px;flex-wrap:wrap}.habit{padding:8px 10px;border-radius:999px;background:#ffffff0d;font-size:11px}.guard{display:grid;grid-template-columns:1fr 1fr;gap:9px}.guard span{padding:11px;border-radius:14px;background:#ffffff09}.error{margin-top:24px;padding:30px;border-radius:24px;text-align:center;background:#fff;color:#252b5d}.error h2{margin-top:0}.loading{text-align:center;padding:70px 15px;color:#d7ddff}.spin{width:48px;height:48px;margin:0 auto 14px;border:5px solid #ffffff25;border-top-color:#47dcd5;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.profile{grid-template-columns:105px 1fr}.photo{width:105px;height:105px}.privacy{grid-column:1/-1}.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:560px){.top{align-items:flex-start}.brand small{display:none}.actions{justify-content:flex-end}.profile{grid-template-columns:1fr;text-align:center}.photo{margin:auto}.meta{justify-content:center}.stats{grid-template-columns:1fr 1fr}.guard{grid-template-columns:1fr}.skill{grid-template-columns:95px 1fr 42px}.btn{padding:9px 10px;font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">T</div><div><b>Academy Admin</b><small>READ-ONLY STUDENT LEARNING VIEW</small></div></div>
    <div class="actions"><a class="btn soft" href="index.html#students">← Student Galaxy</a><a class="btn soft" href="admin.html">Admin Center</a><button class="btn primary" id="refreshBtn">Refresh</button></div>
  </header>
  <main id="app"><div class="loading"><div class="spin"></div>Loading student learning progress…</div></main>
</div>
<script>
const API="https://brightbyte-kids-api.tanweerstudy25.workers.dev";
const token=localStorage.getItem("brightbyte_admin_token")||"";
const id=Number(new URLSearchParams(location.search).get("id")||0);
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(String(d).replace(" ","T")+(/Z$|[+-]\d\d:\d\d$/.test(String(d))?"":"Z")).toLocaleString():"—";
const pct=(a,b=100)=>b?Math.max(0,Math.min(100,Math.round(Number(a||0)/Number(b||100)*100))):0;
function errorBox(title,msg){app.innerHTML=`<section class="error"><h2>${esc(title)}</h2><p>${esc(msg)}</p><p><a class="btn primary" href="admin.html">Open Admin Login</a></p></section>`}
async function authFetch(path){return fetch(API+path,{headers:{Authorization:"Bearer "+token},cache:"no-store"})}
async function loadPhoto(userId){try{const r=await authFetch(`/api/admin/students/${userId}/photo`);if(!r.ok)return;const u=URL.createObjectURL(await r.blob());const box=document.getElementById("photo");if(box)box.innerHTML=`<img src="${u}" alt="Student photo">`}catch{}}
function render(d){
 const s=d.student||{},c=d.course||{},set=d.settings||{},day=Math.max(1,Math.min(90,Number(c.day_number||1))),week=Math.min(12,Math.ceil(day/7)),month=Math.min(3,Math.ceil(day/30));
 const skills=c.skill_scores&&typeof c.skill_scores==='object'?c.skill_scores:{};
 const skillKeys=Object.keys(skills);
 const assessments=d.assessments||[],events=d.recent_events||[],portfolio=d.portfolio||[],habits=d.latest_habit?.habits||{};
 const latestAssessment=assessments[0];
 app.innerHTML=`
 <section class="hero">
  <div class="profile">
   <div class="photo" id="photo">🧒</div>
   <div><span class="eyebrow">ADMIN READ-ONLY VIEW</span><h1>${esc(s.display_name||s.username||"Student")}</h1><div class="meta"><span>🎓 Class ${Number(s.class_number||1)}</span><span>🆔 ${esc(s.username||"")}</span><span>📚 ${esc(s.training_track||"90-Day Program")}</span><span>🕒 Last login: ${esc(fmt(s.last_login_at))}</span></div></div>
   <div class="privacy"><b>${Number(s.is_public||0)?"🌐 Public":"🔒 Private"}</b><small>${esc(s.status||"active")}</small></div>
  </div>
  <div class="stats">
   <div class="stat"><b>${Number(s.progress_percent||0)}%</b><small>PROFILE PROGRESS</small></div>
   <div class="stat"><b>${day}/90</b><small>COURSE DAY</small></div>
   <div class="stat"><b>${week}</b><small>WEEK</small></div>
   <div class="stat"><b>${month}</b><small>MONTH</small></div>
   <div class="stat"><b>${Number(c.stars||s.stars||0)}</b><small>STARS</small></div>
   <div class="stat"><b>${Number(set.streak_days||0)}</b><small>STREAK DAYS</small></div>
  </div>
 </section>
 <div class="grid">
  <section class="card"><h2>📊 Skill Passport</h2>${skillKeys.length?`<div class="skills">${skillKeys.map(k=>{const v=Number(skills[k]||0);return `<div class="skill"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.min(100,v)}%"></i></div><b>${v}%</b></div>`}).join("")}</div>`:'<p class="empty">No skill scores recorded yet.</p>'}</section>
  <section class="card"><h2>🧪 Assessment Summary</h2>${latestAssessment?`<div class="item"><b>${esc(latestAssessment.assessment_type)} • Period ${Number(latestAssessment.period_number||1)}</b><small>${Number(latestAssessment.score||0)} / ${Number(latestAssessment.max_score||100)} (${pct(latestAssessment.score,latestAssessment.max_score)}%) • ${esc(fmt(latestAssessment.completed_at))}</small></div>`:'<p class="empty">No assessment completed yet.</p>'}<div class="list">${assessments.slice(1,6).map(a=>`<div class="item"><b>${esc(a.assessment_type)} • Period ${Number(a.period_number||1)}</b><small>${Number(a.score||0)} / ${Number(a.max_score||100)} • ${esc(fmt(a.completed_at))}</small></div>`).join("")}</div></section>
  <section class="card"><h2>🧭 Course Activity</h2><div class="list"><div class="item"><b>Current stage</b><small>Day ${day} • Week ${week} • Month ${month}</small></div><div class="item"><b>Daily mission records</b><small>${Array.isArray(c.daily_completed)?c.daily_completed.length:0} completed activity marks</small></div><div class="item"><b>Final project</b><small>${esc(c.project_status||"not_started")}</small></div><div class="item"><b>Last learning activity</b><small>${esc(fmt(c.last_activity_at))}</small></div></div></section>
  <section class="card"><h2>🏆 Challenges & Battle</h2><div class="list"><div class="item"><b>${Number(d.battles?.total||0)} challenges</b><small>${Number(d.battles?.completed||0)} completed • ${Number(d.battles?.wins||0)} wins</small></div><div class="item"><b>Competition</b><small>${Number(set.competition_enabled||0)?"Enabled":"Disabled"}</small></div></div></section>
  <section class="card"><h2>👨‍🏫 Teacher & Parent Support</h2><div class="list"><div class="item"><b>Teacher feedback</b><small>${esc(set.teacher_feedback||"No teacher feedback yet.")}</small></div><div class="item"><b>Parent home practice</b><small>${esc(set.parent_practice||"No home-practice note yet.")}</small></div></div></section>
  <section class="card"><h2>👨‍👩‍👧 Guardian / Enrollment</h2><div class="guard"><span><b>Guardian</b><br>${esc(s.guardian_name||"Not provided")}</span><span><b>Email</b><br>${esc(s.guardian_email||"Not provided")}</span></div><p class="muted">Guardian details are visible here only because this is an authenticated Admin view.</p></section>
  <section class="card wide"><h2>🕒 Recent Learning Activity</h2>${events.length?`<div class="list">${events.slice(0,12).map(e=>`<div class="item"><b>${esc(e.topic||e.event_type||"Learning activity")}${e.score===null||e.score===undefined?"":` • Score ${Number(e.score)}`}</b><small>${esc(e.event_type||"")} • ${esc(fmt(e.created_at))}</small></div>`).join("")}</div>`:'<p class="empty">No detailed learning events recorded yet.</p>'}</section>
  <section class="card"><h2>🗂️ Student Portfolio</h2>${portfolio.length?`<div class="list">${portfolio.slice(0,8).map(p=>`<div class="item"><b>${esc(p.title||"Portfolio item")}</b><small>${esc(p.item_type||"project")} • ${esc(fmt(p.created_at))}</small></div>`).join("")}</div>`:'<p class="empty">No portfolio items yet.</p>'}</section>
  <section class="card"><h2>🌱 Latest Habit Check</h2>${d.latest_habit?`<p class="muted">${esc(d.latest_habit.habit_date||"")}</p><div class="habit-grid">${Object.entries(habits).map(([k,v])=>`<span class="habit">${v?"✅":"⬜"} ${esc(k)}</span>`).join("")||'<span class="empty">No habits marked.</span>'}</div>`:'<p class="empty">No habit tracker entry yet.</p>'}</section>
 </div>`;
 loadPhoto(s.user_id);
}
async function boot(){
 if(!id)return errorBox("Student not selected","Return to Student Galaxy and click a student card.");
 if(!token)return errorBox("Admin login required","Please log in as Admin first, then open the student card again.");
 try{
  const me=await authFetch('/api/auth/me');const md=await me.json();
  if(!me.ok||md.role!=="admin")return errorBox("Admin login required","This page is available only to an authenticated Admin.");
  const r=await authFetch(`/api/admin/students/${id}/learning-overview`);const d=await r.json();
  if(!r.ok)throw new Error(d.error||"Could not load student progress");
  render(d);
 }catch(err){errorBox("Could not load progress",err.message||"Please try again.")}
}
document.getElementById('refreshBtn').onclick=boot;boot();
</script>
</body>
</html>
